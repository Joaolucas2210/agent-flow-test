name: quality-gates

# Runs the framework's ci-quality-gates.sh on PRs and pushes to main.
# The heavy lifting lives in hooks/ci-quality-gates.sh — this workflow just sets up the
# toolchain and calls it. Tool-specific steps are commented; uncomment for your stack.
#
# Placement: copy this file to your repo root at .github/workflows/quality-gates.yml
# (GitHub only reads workflows from the repo-root .github/workflows/, not from subfolders).

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (saves CI minutes — ponytail).
concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # needed only if you post reviewer comments (see review-panel job)

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      FRAMEWORK_DIR: ai-development-framework   # adjust if you relocated the framework
      GRAPHIFY_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: needed for changed-line coverage + complexity*churn

      # --- Toolchain (uncomment what your stack needs) ---------------------------------
      # - uses: actions/setup-python@v5
      #   with: { python-version: "3.12" }
      # - uses: actions/setup-node@v4
      #   with: { node-version: "20" }

      # --- RTK — Rust Token Killer (output compression) --------------------------------
      # ponytail: gates run without RTK; it just compresses logs. Skip if not published for CI.
      - name: Install RTK
        run: |
          if command -v cargo >/dev/null 2>&1; then
            cargo install rtk 2>/dev/null || echo "::warning::RTK install skipped — verify package/source at https://github.com/rtk-ai/rtk"
          else
            echo "::notice::cargo absent — skipping RTK; gates still run uncompressed"
          fi

      # --- Graphify (knowledge graph) --------------------------------------------------
      # The graph is built by the /graphify skill in-agent (LLM-driven), NOT in shell CI.
      # So CI only checks freshness; the dependency-cycle gate uses a static tool (madge/pydeps).
      - name: Check knowledge graph freshness
        run: |
          if [ -f graphify-out/graph.json ]; then
            [ -f graphify-out/.stale ] && echo "::warning::graph stale — run '/graphify . --update' in-agent" || echo "::notice::graph present"
          else
            echo "::notice::no graphify-out/graph.json — build in-agent with '/graphify .'"
          fi

      # --- Metric tools (uncomment + match your stack) ---------------------------------
      # - name: Install metric tools
      #   run: |
      #     pip install pytest pytest-cov mutmut lizard   # Python
      #     npm  install -g madge stryker-cli             # JS/TS

      # --- The gate: coverage, complexity, mutation, cycles, rtk gain ------------------
      # All real thresholds live in rules/quality-thresholds.md; tool lines are toggled
      # inside ci-quality-gates.sh. This step fails the job on any failing metric.
      - name: Run quality gates
        run: |
          chmod +x "$FRAMEWORK_DIR/hooks/ci-quality-gates.sh"
          "$FRAMEWORK_DIR/hooks/ci-quality-gates.sh"

      # --- Ponytail enforcement (over-engineering check) -------------------------------
      # ponytail: surfaces reinvented-stdlib / speculative-abstraction findings on the diff.
      # Non-blocking by default (advisory). Drop the `|| true` to make it a hard gate.
      - name: Ponytail enforcement
        run: |
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=1 2>/dev/null || true
          echo "::group::Ponytail over-engineering scan (advisory)"
          echo "Diff for reviewer/agent context:"
          git diff --stat "origin/${{ github.base_ref || 'main' }}"...HEAD || true
          echo "Enforce via reviewers or a /ponytail-review pass; see skills/ponytail/SKILL.md"
          echo "::endgroup::"
        continue-on-error: true

  # --- Multi-agent reviewers (optional, opt-in) --------------------------------------
  # The reviewer panel (agents/*) runs inside Claude Code, not natively on GitHub runners.
  # Enable this job only if you have Claude Code available in CI (e.g. anthropics/claude-code-action).
  # Left disabled by default so the workflow is green out of the box (ponytail: no dead CI).
  review-panel:
    if: false   # flip to `github.event_name == 'pull_request'` once Claude Code is wired into CI
    runs-on: ubuntu-latest
    needs: gates
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # - name: Run reviewer panel
      #   uses: anthropics/claude-code-action@v1     # verify action name/version
      #   with:
      #     prompt: "/review"                        # dispatches backend/database/qa/security reviewers
      #     anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: echo "Reviewer panel placeholder — see agents/ and skills/pr-review/SKILL.md"
